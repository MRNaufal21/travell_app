name: travell_app
description: "Aplikasi mobile inovatif ini menyederhanakan manajemen travel mobil dengan memisahkan pengalaman admin dan klien, dilengkapi fitur persetujuan registrasi akun dan integrasi data publik BMKG untuk perkiraan cuaca perjalanan yang lebih akurat."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  provider: ^6.1.2
  go_router: ^16.2.0
  shared_preferences: ^2.0.0
  intl: 0.20.2
  http: ^1.0.0
  flutter_svg: ^2.0.0
  cloud_firestore: ^6.1.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  url_launcher: ^6.3.0
  fl_chart: ^0.70.0
  google_maps_flutter: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/dreamflow_icon.jpg
  remove_alpha_ios: true
